name: Sync Backend to Hugging Face
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:  # This line is key
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Action"

          # 1. Isolate the backend folder into a temporary local branch called 'to-deploy'
          git subtree split --prefix backend -b to-deploy

          # 2. Force push ONLY that temporary branch to Hugging Face
          git push https://saad-muhammad:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/saad-muhammad/attendance-backend to-deploy:main --force