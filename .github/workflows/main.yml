name: Sync Backend to Hugging Face
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:  # This line is key
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Action"

          # Create a fresh orphan branch to squash history
          git checkout --orphan deploy-branch
          
          # Unstage and remove all files to start clean
          git rm -rf .
          
          # Checkout only the backend folder from the original branch
          git checkout ${{ github.sha }} -- backend/
          
          # Move all backend files to root (including hidden ones)
          cp -r backend/. .
          rm -rf backend
          
          # Add all files to the new commit
          git add .
          git commit -m "Deploy backend to Hugging Face (Squashed)"
          
          # Push the new root to Hugging Face
          git push https://saad-muhammad:$HF_TOKEN@huggingface.co/spaces/saad-muhammad/Test_on_new_branch HEAD:main --force

 